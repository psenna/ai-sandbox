# ai-sandbox — default stack: the docker-operator.
#
# A Docker-native multi-agent orchestrator: create/list/watch/delete Claude Code
# agent containers through a REST API and a small web UI with a live terminal per
# agent, each agent getting its own private Docker-in-Docker sidecar. `docker
# compose up -d` here brings up the shared services (ollama, git-proxy, postgres,
# dependaproxy) plus the operator; open http://127.0.0.1:${LISTEN_PORT:-8000}.
#
# This file only INCLUDES docker-operator/docker-compose.yaml — that file is the
# single source of truth and is still runnable from its own directory. Its
# relative paths (../config.yaml, ../credentials.yaml, ../dependaproxy.yaml,
# ../.ollama, ./data/…) resolve against docker-operator/, so they land at the
# repo root / under docker-operator/data/ either way. Secrets go in .env at the
# repo root (see .env.example) — `env_file: .env` below is resolved relative to
# THIS file's directory (the repo root) and feeds the included model's ${...}
# interpolation from there.
#
# The single-agent "compose stack" (a static `claude` container + one shared
# `docker` DinD sidecar, driven with `docker compose exec claude claude`) was
# retired when the docker-operator became the default — recover it from git
# history if you need it.
#
# Full guide: docker-operator/README.md
#   quickstart · REST API · web UI · authenticating the API · troubleshooting

name: docker-operator

include:
  - path: docker-operator/docker-compose.yaml
    env_file: .env
