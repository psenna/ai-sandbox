# ai-sandbox: Claude Code (via Ollama) → git-proxy → real GitHub, with a rootless
# DinD daemon for dev workloads and a DependaProxy for supply-chain-safe npm.
#
# Topology (three isolated bridge networks):
#   proxynet:  ollama, git-proxy, dependaproxy, claude
#   dinernet:  docker (DinD), dependaproxy, claude
#   dbnet:     postgres, dependaproxy            (DependaProxy's trust storage)
#
#   ollama (daemon) serves Anthropic-compatible /v1/messages on :11434
#     └── :cloud models proxied to ollama.com (device auth via the ./.ollama
#         SSH keypair set up by `ollama signin`); local models run on-device.
#   claude (agent) → http://ollama:11434 (Anthropic-compatible API)
#   claude (agent) --8080(git)/8090(broker)--> git-proxy --https--> github.com
#     git insteadOf rewrites https://github.com/<x> -> http://git-proxy:8080/<x>
#     http.extraHeader attaches the agent Bearer
#   claude (agent) --DOCKER_HOST=tcp://docker:2375--> docker (rootless DinD)
#     └── runs node/python/go/services in isolated containers on dinernet
#   npm (claude + workload containers) → http://dependaproxy:8080/npm
#     └── DependaProxy validates + hashes every package (postgres trust anchor);
#         the DinD daemon blocks direct egress to registry.npmjs.org (dind-init.sh)
#
# The agent NEVER sees the GitHub PAT: git-proxy holds it in credentials.yaml and
# attaches it on the proxy→GitHub leg (HTTP Basic for the git protocol, Bearer for
# the broker REST leg). The agent authenticates to the proxy with a low-value
# Bearer (auth.tokens in config.yaml). The DinD daemon is on dinernet ONLY —
# git-proxy is not — so a compromised daemon has no route to the proxy's creds.
#
# Prerequisites:
#   - Ubuntu 24.04 host with sysbox-ce installed (run ./setup-ubuntu-host.sh).
#   - ghcr.io/psenna/git-proxy:v0.0.3 published (or uncomment the build: block
#     below to build from a sibling ../git-proxy checkout).
#   - ghcr.io/psenna/dependaproxy:v0.0.0 published.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-sandbox-ollama
    # Serves the Anthropic-compatible /v1/messages endpoint on :11434.
    #   - :cloud models (e.g. glm-5.2:cloud) are proxied to ollama.com. The local
    #     daemon authenticates the DEVICE with the SSH keypair in ~/.ollama
    #     (id_ed25519 + config.json), set up by `ollama signin` — NOT by
    #     OLLAMA_API_KEY (that's only for direct ollama.com API calls). So we
    #     bind-mount the host ./.ollama directory, which holds your registered
    #     key. To start fresh instead, leave ./.ollama empty and run
    #     `docker compose exec ollama ollama signin` once (the key persists in the
    #     bind mount).
    #   - local models are pulled (`docker compose exec ollama ollama pull
    #     <model>`) and run on-device (CPU — no GPU on this host).
    # No host port mapping — claude reaches it at http://ollama:11434 on proxynet.
    environment:
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-131072}"
    volumes:
      - ./.ollama:/root/.ollama
    networks:
      - proxynet
    # The ollama image has no curl; use bash's /dev/tcp to check the daemon is up.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  git-proxy:
    # Published image. If it is not available yet, comment out `image:` and
    # uncomment the `build:` block to build from a sibling git-proxy checkout:
    #   build:
    #     context: ../git-proxy
    #     dockerfile: Dockerfile
    image: ghcr.io/psenna/git-proxy:v0.0.4
    container_name: ai-sandbox-gitproxy
    # Run as the image's non-root gitproxy user (uid 1000). The bind-mounted
    # data/ dirs must be writable by uid 1000 — see README.md if your host uid
    # differs (sudo chown -R 1000:1000 data).
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080"   # git-protocol leg (clone/fetch/push)
      - "127.0.0.1:8090:8090"   # broker REST leg (PR + CI + issue ops)
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./credentials.yaml:/credentials.yaml:ro
      - ./data/mirror:/tmp/git-proxy-mirror
      - ./data/audit:/tmp/git-proxy
    networks:
      - proxynet

  # DependaProxy's trust-anchor storage (PostgreSQL). Isolated on dbnet: only the
  # dependaproxy service can reach it (neither claude nor the DinD daemon is on
  # dbnet). DependaProxy auto-applies its schema at startup
  # (CREATE TABLE IF NOT EXISTS) — no manual migration. The POSTGRES_PASSWORD
  # MUST match storage.dsn in dependaproxy.yaml (change both in your local copy;
  # the committed file keeps the dev default).
  postgres:
    image: postgres:18
    container_name: ai-sandbox-postgres
    environment:
      POSTGRES_USER: dependaproxy
      POSTGRES_PASSWORD: dependaproxy-secret
      POSTGRES_DB: dependaproxy
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dependaproxy -d dependaproxy"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # The secure dependency proxy: validates + hashes every npm package and serves
  # them under /npm. The agent's npm clients (claude itself + the workload
  # containers it launches in DinD) point their registry here and never touch
  # registry.npmjs.org. On proxynet so claude reaches it by name; on dinernet
  # (STATIC IP 172.20.0.10) so workload containers inside the nested daemon can
  # reach it — they cannot resolve sibling compose names, so the use-docker skill
  # passes --add-host=dependaproxy:172.20.0.10. The cache dir is a host bind mount
  # that must be writable by the image's uid 65532 — see README.md (sudo chown -R
  # 65532:65532 data/dependaproxy-cache). No healthcheck: the image is FROM scratch
  # and has no healthcheck binary; claude depends on it with service_started.
  dependaproxy:
    image: ghcr.io/psenna/dependaproxy:v0.0.0
    container_name: ai-sandbox-dependaproxy
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dependaproxy.yaml:/config.yaml:ro
      - ./data/dependaproxy-cache:/var/lib/dependaproxy/cache
    networks:
      proxynet: {}
      dbnet: {}
      dinernet:
        ipv4_address: 172.20.0.10

  # Rootless Docker-in-Docker daemon. The agent (claude) uses it to run arbitrary
  # images (node, python, go, postgres, mysql, minio, …) via DOCKER_HOST — dev
  # tasks NEVER run directly on the claude container. Runs under the sysbox
  # runtime with NO --privileged: sysbox user-namespace mapping makes the inner
  # dockerd unprivileged on the host, so it cannot access host devices or
  # git-proxy's bind mounts (incl. credentials.yaml). It is on dinernet ONLY —
  # git-proxy is not on dinernet, so a compromised daemon has no route to the
  # proxy. Host prerequisite: sysbox must be installed (run setup-ubuntu-host.sh).
  #
  # entrypoint is replaced by scripts/dind-init.sh (mounted below): it starts
  # dockerd in the background, then inserts iptables DOCKER-USER REJECT rules for
  # the public npm registries — so workload containers can fetch npm packages ONLY
  # through DependaProxy, even if an agent points npm at registry.npmjs.org. With
  # DOCKER_TLS_CERTDIR="" the image's own entrypoint would only exec dockerd, which
  # the script replicates (update it if the base image's entrypoint semantics
  # change). The iptables host list is resolved at container start; restart the
  # docker service to refresh it.
  docker:
    image: docker:27-dind
    runtime: sysbox-runc
    container_name: ai-sandbox-dind
    entrypoint: ["sh", "/dind-init.sh"]
    # The docker:dind entrypoint (dockerd-entrypoint.sh) execs `dockerd "$@"`, so
    # `command:` is the dockerd args. Listen on TCP for cross-container access on
    # dinernet AND on the unix socket for the in-container healthcheck.
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    # The docker:dind image defaults DOCKER_TLS_CERTDIR=/certs, which makes the
    # entrypoint generate a CA + server cert and start dockerd with --tlsverify
    # on the TCP host. The claude client connects plain HTTP
    # (DOCKER_HOST=tcp://docker:2375, no cert bundle) -> "Client sent an HTTP
    # request to an HTTPS server". The use-docker skill documents plain
    # `docker run` over that TCP host, so disable TLS: serve plain HTTP on 2375.
    # Safe because the daemon is on dinernet only (isolated bridge, no host
    # port) shared solely with claude — TLS between agent and daemon is not the
    # security boundary here (sysbox user-namespacing is).
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-cache:/var/lib/docker   # image/layer cache survives restarts
      - workspace:/workspace           # shared with claude (the exchange point)
      - ./scripts/dind-init.sh:/dind-init.sh:ro   # npm-egress block (see above)
    networks:
      - dinernet
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  claude:
    build:
      context: .
      dockerfile: Dockerfile
    image: psenna/ai-sandbox:0.1.0
    container_name: ai-sandbox-agent
    depends_on:
      ollama:
        condition: service_healthy
      git-proxy:
        condition: service_started
      docker:
        condition: service_healthy
      dependaproxy:
        condition: service_started
    # Interactive: the container idles on bash (default CMD) so the operator can
    #   docker compose exec claude claude            # interactive Claude Code
    #   docker compose exec claude claude -p "..."   # headless one-shot
    # Or override the command for a fresh run:
    #   docker compose run --rm claude claude -p "your task"
    stdin_open: true
    tty: true
    environment:
      # --- Ollama daemon (Anthropic-compatible /v1/messages) ---
      ANTHROPIC_BASE_URL: "http://ollama:11434"     # local Ollama daemon (Anthropic-compatible)
      ANTHROPIC_AUTH_TOKEN: "ollama"                 # fixed token for local Ollama (not a real secret)
      ANTHROPIC_API_KEY: ""                          # empty: no Anthropic cloud fallback
      ANTHROPIC_MODEL: "${OLLAMA_MODEL:-glm-5.2:cloud}"
      # Map EVERY model tier Claude Code can pick to the Ollama model. Without
      # the sonnet/opus tiers, the Task/Explore subagents fall back to real
      # Claude model ids (claude-sonnet-5 / claude-opus-5) that don't exist on
      # the Ollama backend → "model may not exist or you may not have access".
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${OLLAMA_MODEL:-glm-5.2:cloud}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${OLLAMA_MODEL:-glm-5.2:cloud}"
      ANTHROPIC_DEFAULT_OPUS_MODEL: "${OLLAMA_MODEL:-glm-5.2:cloud}"
      CLAUDE_CODE_ATTRIBUTION_HEADER: "0"            # keeps prompt caching valid on non-Anthropic backends
      CLAUDE_CONFIG_DIR: "/home/node/.claude-sandbox"  # isolate config from any host claude.ai auth
      # --- git-proxy legs (consumed by the entrypoint + the use-git-proxy skill) ---
      AGENT_TOKEN: "${AGENT_TOKEN}"                  # the agent's Bearer to the proxy (NOT the GitHub PAT)
      GITHUB_REPO: "${GITHUB_REPO}"                  # owner/repo.git the agent clones
      GIT_PROXY_URL: "http://git-proxy:8080"
      GIT_PROXY_BROKER_URL: "http://git-proxy:8090"
      GIT_PROXY_TOKEN: "${AGENT_TOKEN}"
      GIT_PROXY_HEADER: "http.extraheader=Authorization: Bearer ${AGENT_TOKEN}"
      # --- DependaProxy: npm MUST go through the secure proxy ---
      # The entrypoint writes these into /home/node/.npmrc (claude's own npm) and
      # /workspace/.npmrc (mounted into DinD workload containers by use-docker).
      DEPENDAPROXY_URL: "http://dependaproxy:8080/npm"
      DEPENDAPROXY_TOKEN: "${DEPENDAPROXY_TOKEN}"    # placeholder in dependaproxy.yaml; fill .env
      NPM_CONFIG_REGISTRY: "http://dependaproxy:8080/npm"
      # Docker client -> the rootless DinD daemon on the isolated dinernet.
      DOCKER_HOST: "tcp://docker:2375"
      DOCKER_TLS_VERIFY: ""
    volumes:
      - workspace:/workspace
      - claude-config:/home/node/.claude-sandbox   # persist plugins/sessions across restarts
    networks:
      - proxynet
      - dinernet

networks:
  # Explicit subnets everywhere: dependaproxy needs a stable dinernet IP
  # (172.20.0.10) so workload containers inside the DinD daemon can reach it by
  # --add-host, and fixed ranges prevent accidental overlap with Docker's
  # auto-assigned bridge subnets.
  proxynet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  dinernet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  dbnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  workspace: {}
  docker-cache: {}
  claude-config: {}
  pgdata: {}
