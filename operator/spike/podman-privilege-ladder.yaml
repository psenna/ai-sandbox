# Reproduction manifest for the #23 privilege ladder. Apply it, then for each
# pod run:
#
#   kubectl -n spike exec <pod> -- podman run --rm docker.io/library/alpine:3.20 echo RUN-OK
#
# Expected on Ubuntu/AppArmor (see ../docs/spike-rootless-podman.md):
#   pm-baseline        FAIL   configure storage: failed to make mount private
#   pm-hostusers       FAIL   same; a pod userns does not help
#   pm-sysadmin        FAIL   caps are not effective for a non-root uid
#   pm-sysadmin-root   FAIL   root + SYS_ADMIN is still not enough
#   pm-apparmor        OK     AppArmor Unconfined alone unblocks it
#   pm-aa-seccomp      FAIL   cannot clone: seccomp RuntimeDefault blocks userns
#   pm-aa-noprivesc    FAIL   newuidmap cannot apply its file capability
#   pm-privileged      OK     works, but far more privilege than necessary
#
# This file is a REGRESSION TEST, not a one-off (#24). Two halves:
#
#  1. Mechanical, in CI: internal/render/spikeladder_test.go parses this
#     file and asserts (a) every image ref equals render.DefaultPodmanImage,
#     and (b) the securityContext RenderPod produces for the `podman`
#     sidecar matches pm-apparmor (case G) field for field and matches NONE
#     of the failing cases' distinguishing fields. Bumping the podman digest
#     without updating this file fails `make test`.
#
#  2. Manual, on any podman bump: re-run the ladder before merging the bump.
#       kubectl apply -f operator/spike/podman-privilege-ladder.yaml
#       for p in pm-baseline pm-hostusers pm-sysadmin pm-sysadmin-root \
#                pm-apparmor pm-aa-seccomp pm-aa-noprivesc pm-privileged; do
#         kubectl -n spike wait --for=condition=Ready pod/$p --timeout=120s
#         echo -n "$p: "; kubectl -n spike exec $p -- \
#           podman run --rm docker.io/library/alpine:3.20 echo RUN-OK || echo FAIL
#       done
#       kubectl delete ns spike
#     The expected column below must still hold. If pm-aa-seccomp or
#     pm-aa-noprivesc starts PASSING, the corresponding Relaxation in
#     internal/render/engine_podman.go is no longer necessary and must be
#     removed. If pm-apparmor starts FAILING, this engine is broken on that
#     podman version -- do not merge the bump.
apiVersion: v1
kind: Namespace
metadata:
  name: spike
---
apiVersion: v1
kind: Pod
metadata: { name: pm-baseline, namespace: spike }
spec:
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      env: [{ name: HOME, value: /home/podman }]
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }
---
apiVersion: v1
kind: Pod
metadata: { name: pm-hostusers, namespace: spike }
spec:
  hostUsers: false
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      env: [{ name: HOME, value: /home/podman }]
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }
---
apiVersion: v1
kind: Pod
metadata: { name: pm-sysadmin, namespace: spike }
spec:
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      env: [{ name: HOME, value: /home/podman }]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        capabilities: { add: ["SYS_ADMIN"] }
---
apiVersion: v1
kind: Pod
metadata: { name: pm-sysadmin-root, namespace: spike }
spec:
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      securityContext:
        runAsUser: 0
        capabilities: { drop: ["ALL"], add: ["SYS_ADMIN"] }
---
apiVersion: v1
kind: Pod
metadata: { name: pm-apparmor, namespace: spike }
spec:
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      env: [{ name: HOME, value: /home/podman }]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        appArmorProfile: { type: Unconfined }
---
apiVersion: v1
kind: Pod
metadata: { name: pm-aa-seccomp, namespace: spike }
spec:
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      env: [{ name: HOME, value: /home/podman }]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
        appArmorProfile: { type: Unconfined }
---
apiVersion: v1
kind: Pod
metadata: { name: pm-aa-noprivesc, namespace: spike }
spec:
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      env: [{ name: HOME, value: /home/podman }]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        appArmorProfile: { type: Unconfined }
---
apiVersion: v1
kind: Pod
metadata: { name: pm-privileged, namespace: spike }
spec:
  restartPolicy: Never
  containers:
    - name: podman
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      command: ["sleep", "36000"]
      env: [{ name: HOME, value: /home/podman }]
      securityContext: { privileged: true }
