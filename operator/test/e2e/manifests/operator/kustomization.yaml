# e2e overlay on top of ../../../../config/default (i.e. operator/config/default):
# retags the operator image to the `:e2e` build hack/e2e-up.sh produces,
# forces imagePullPolicy so kind-loaded images are actually used (never
# `:latest` -- see RenderPod's imagePullPolicy note), and disables leader
# election (single replica, no lease-acquisition latency in the critical
# path of every e2e run -- deliberately out of scope for #22; a real flake
# source with replicas=1). Flag names verified against operator/cmd/main.go
# -> internal/config/config.go's flag.*Var calls.
resources:
  - ../../../../config/default

images:
  # config/default/kustomization.yaml (a nested kustomization, resolved
  # before this overlay's own transformers run) already retags the base
  # `controller:latest` placeholder to ghcr.io/psenna/ai-sandbox-operator:dev
  # -- so the images transform here must match THAT resolved name, not the
  # original `controller` placeholder, or it silently no-ops.
  - name: ghcr.io/psenna/ai-sandbox-operator
    newName: ai-sandbox-operator
    newTag: e2e

patches:
  - target:
      kind: Deployment
      name: ai-sandbox-operator-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - --leader-elect=false
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8080
          - --slot-capacity=8
          - --scheduler-interval=2s
          # #29: 5s (not the 1m default) so the warm-cache GC spec in
          # wake_test.go can observe a TTL-based reclamation pass within a
          # test-viable window. This op REPLACES the whole args array, so
          # omitting the flag would silently leave the 1m default.
          - --warm-cache-gc-interval=5s
          # #32: same reasoning as --warm-cache-gc-interval above -- a short
          # interval and TTL so a retention-GC e2e spec can observe a
          # TTL-based reclamation pass within a test-viable window, rather
          # than the 30m/168h defaults.
          - --retention-gc-interval=5s
          - --retention-ttl=2m
          - --sidecar-image=ai-sandbox-operator:e2e
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
