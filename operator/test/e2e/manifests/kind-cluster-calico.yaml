# UNTESTED END-TO-END. Fallback CNI for the operator's e2e suite
# (E2E_CNI=calico), for use if a future kind/kindnetd version regresses the
# NetworkPolicy enforcement the default kind-cluster.yaml's kindnet CNI was
# verified to provide (see that file's header and test/e2e/netpolicy.go).
#
# During planning: cluster creation with disableDefaultCNI:true and
# `kubectl apply -f` of the Calico manifest both worked, but the
# `calico/node` image failed to unpack with "no space left on device" in the
# planning sandbox -- a disk-space problem in that environment, not a
# capability problem with this config. hack/e2e-up.sh's E2E_CNI=calico
# branch (apply
# https://raw.githubusercontent.com/projectcalico/calico/v3.30.2/manifests/calico.yaml,
# then `kubectl -n kube-system rollout status ds/calico-node --timeout=300s`)
# is implemented, but this path has never been observed to reach a fully
# Ready calico-node DaemonSet, let alone pass the NetworkPolicy enforcement
# gate. Treat it as a documented, plausible fallback, not a verified one.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        serializeImagePulls: false
    extraPortMappings:
      - containerPort: 30900
        hostPort: 30900
        protocol: TCP
      - containerPort: 30901
        hostPort: 30901
        protocol: TCP
      - containerPort: 30902
        hostPort: 30902
        protocol: TCP
