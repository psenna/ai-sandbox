# platform-doubles: the fake git-proxy broker + stub model endpoint + (#28)
# s3proxy fault-injection reverse proxy + (#24) npmregistry double
# (test/e2e/doubles), run as four containers in one pod (one image, one
# build, one `kind load`). The broker and model doubles are not consumed by
# the operator today (see #22's non-goals) -- they exist as controllable
# HTTP fixtures for this suite's doubles_test.go and for later issues (#30
# wait-probes, agent PR/issue workflows) to build on. s3proxy IS consumed
# today by freeze_test.go's backend-outage spec. npmregistry IS consumed
# today by engine_test.go's "installs an npm package through dependaproxy"
# spec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-doubles
  namespace: ai-sandbox-e2e
  labels:
    app: platform-doubles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-doubles
  template:
    metadata:
      labels:
        app: platform-doubles
    spec:
      containers:
        - name: broker
          image: ai-sandbox-e2e-doubles:test
          imagePullPolicy: IfNotPresent
          args: ["broker"]
          env:
            - name: BROKER_TOKEN
              value: e2e-token
          ports:
            - name: broker
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
        - name: model
          image: ai-sandbox-e2e-doubles:test
          imagePullPolicy: IfNotPresent
          args: ["model"]
          ports:
            - name: model
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 2
            failureThreshold: 30
        - name: s3proxy
          image: ai-sandbox-e2e-doubles:test
          imagePullPolicy: IfNotPresent
          args: ["s3proxy"]
          env:
            - name: S3_UPSTREAM
              value: http://minio.ai-sandbox-e2e.svc.cluster.local:9000
          ports:
            - name: s3proxy
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            periodSeconds: 2
            failureThreshold: 30
        - name: npmregistry
          image: ai-sandbox-e2e-doubles:test
          imagePullPolicy: IfNotPresent
          args: ["npmregistry"]
          env:
            - name: NPM_PUBLIC_BASE
              value: http://platform-doubles.ai-sandbox-e2e.svc.cluster.local:8083
          ports:
            - name: npmregistry
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8083
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: platform-doubles
  namespace: ai-sandbox-e2e
spec:
  type: NodePort
  selector:
    app: platform-doubles
  ports:
    - name: broker
      port: 8080
      targetPort: 8080
      nodePort: 30901
    - name: model
      port: 8081
      targetPort: 8081
      nodePort: 30902
    - name: s3proxy
      port: 8082
      targetPort: 8082
      nodePort: 30903
    - name: npmregistry
      port: 8083
      targetPort: 8083
      nodePort: 30904
---
# The only secret the controller actually reads for
# services.gitProxy.tokenSecretRef (internal/controller/resources.go's
# resolveCredentials reads it from Config.ClassSecretNamespace, which
# defaults to the operator's own namespace -- config/default sets
# namePrefix "ai-sandbox-operator-" + namespace "system" ==
# "ai-sandbox-operator-system").
apiVersion: v1
kind: Secret
metadata:
  name: git-proxy-token
  namespace: ai-sandbox-operator-system
type: Opaque
stringData:
  token: e2e-token
