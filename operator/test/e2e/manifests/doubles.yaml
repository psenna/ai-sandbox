# platform-doubles: the fake git-proxy broker + stub model endpoint
# (test/e2e/doubles), run as two containers in one pod (one image, one
# build, one `kind load`). Neither is consumed by the operator today (see
# #22's non-goals) -- they exist as controllable HTTP fixtures for this
# suite's doubles_test.go and for later issues (#30 wait-probes, agent
# PR/issue workflows) to build on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-doubles
  namespace: ai-sandbox-e2e
  labels:
    app: platform-doubles
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-doubles
  template:
    metadata:
      labels:
        app: platform-doubles
    spec:
      containers:
        - name: broker
          image: ai-sandbox-e2e-doubles:test
          imagePullPolicy: IfNotPresent
          args: ["broker"]
          env:
            - name: BROKER_TOKEN
              value: e2e-token
          ports:
            - name: broker
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
        - name: model
          image: ai-sandbox-e2e-doubles:test
          imagePullPolicy: IfNotPresent
          args: ["model"]
          ports:
            - name: model
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: platform-doubles
  namespace: ai-sandbox-e2e
spec:
  type: NodePort
  selector:
    app: platform-doubles
  ports:
    - name: broker
      port: 8080
      targetPort: 8080
      nodePort: 30901
    - name: model
      port: 8081
      targetPort: 8081
      nodePort: 30902
---
# The only secret the controller actually reads for
# services.gitProxy.tokenSecretRef (internal/controller/resources.go's
# resolveCredentials reads it from Config.ClassSecretNamespace, which
# defaults to the operator's own namespace -- config/default sets
# namePrefix "ai-sandbox-operator-" + namespace "system" ==
# "ai-sandbox-operator-system").
apiVersion: v1
kind: Secret
metadata:
  name: git-proxy-token
  namespace: ai-sandbox-operator-system
type: Opaque
stringData:
  token: e2e-token
