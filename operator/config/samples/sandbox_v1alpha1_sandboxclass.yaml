apiVersion: sandbox.psenna.dev/v1alpha1
kind: SandboxClass
metadata:
  name: default
spec:
  agent:
    image: ghcr.io/psenna/ai-sandbox-agent:v1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    model:
      default: claude-sonnet-4-5
      haiku: claude-haiku-4-5
      sonnet: claude-sonnet-4-5
      opus: claude-opus-4-5
  engine:
    type: rootless-podman
    storageDriver: auto
  services:
    gitProxy:
      gitURL: https://git-proxy.ai-sandbox.svc.cluster.local
      brokerURL: https://git-proxy.ai-sandbox.svc.cluster.local/broker
      tokenSecretRef:
        name: git-proxy-agent-token
        key: token
    dependaProxy:
      npmURL: http://dependaproxy.ai-sandbox.svc.cluster.local:8080/npm
      pypiURL: http://dependaproxy.ai-sandbox.svc.cluster.local:8080/pypi
      goproxyURL: http://dependaproxy.ai-sandbox.svc.cluster.local:8080/goproxy
    ollama:
      baseURL: http://ollama.ai-sandbox.svc.cluster.local:11434
  storage:
    workspace:
      size: 20Gi
    backend:
      type: s3
      s3:
        endpoint: https://minio.ai-sandbox.svc.cluster.local
        bucket: sandbox-snapshots
        region: us-east-1
        prefix: default/
        credentialsSecretRef:
          name: sandbox-s3-credentials
          key: token
        forcePathStyle: true
    warmCacheTTL: 30m
  network:
    isolation: Restricted
    extraEgress:
    - cidr: 140.82.112.0/20   # github.com (example)
    - selector:
        namespace: ai-sandbox-e2e
        podSelector:
          matchLabels:
            app: platform-doubles
  timeouts:
    running: 6h
    waiting: 24h
    total: 72h
