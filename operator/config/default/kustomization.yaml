namespace: ai-sandbox-operator-system
namePrefix: ai-sandbox-operator-

resources:
  - ../crd
  - ../rbac
  - ../manager
  # ../prometheus adds a ServiceMonitor (monitoring.coreos.com/v1) scraping
  # the metrics Service ../manager now includes. Left commented out: it
