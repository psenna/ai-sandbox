  - sandboxclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxclasses/status
  - sandboxenvironments/status
  - servicesets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxenvironments
  - servicesets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxenvironments/finalizers
  - servicesets/finalizers
  verbs:
  - update
