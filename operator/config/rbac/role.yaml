---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - serviceaccounts
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxclasses/status
  - sandboxenvironments/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxenvironments/finalizers
  verbs:
  - update
