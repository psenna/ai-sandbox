# The storage.backend union's other arm. Asserts NO `s3:` block renders --
# BackendSpec's XValidation rejects an s3 block under type=pvc. A PVC backend
# also contributes no storage endpoint, so Restricted isolation is fine with
# no extraEgress here. registryMirror IS required though: engine.type=
# rootless-podman + isolation=Restricted with no registry route at all fails
# guard G22.
image:
  tag: v0.1.0

defaultClass:
  create: true
  agent:
    image: ghcr.io/psenna/ai-sandbox-agent:v1
  engine:
    type: rootless-podman
    storageDriver: overlay
  services:
    registryMirror:
      enabled: true
      url: http://registry-cache.ai-sandbox.svc.cluster.local:5000
  storage:
    workspace:
      size: 10Gi
      storageClassName: standard
    backend:
      type: pvc
      pvc:
        claimName: sandbox-archives
        subPath: default/
    warmCacheTTL: 15m
  network:
    isolation: Restricted
  timeouts: {running: 2h, waiting: 12h, total: 24h}
