---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sandboxenvironments.sandbox.psenna.dev
spec:
  group: sandbox.psenna.dev
  names:
    categories:
    - sandbox
    kind: SandboxEnvironment
    listKind: SandboxEnvironmentList
    plural: sandboxenvironments
    shortNames:
    - sbenv
    singular: sandboxenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.slot.granted
      name: Slot
      type: boolean
    - jsonPath: .status.freezeCount
      name: Freezes
      type: integer
    - jsonPath: .status.wakeCount
      name: Wakes
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.classRef.name
      name: Class
      priority: 1
      type: string
    - jsonPath: .spec.repo
      name: Repo
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SandboxEnvironment is a namespaced resource representing a single agent
          run: the class to build the sandbox from, the repository and task the
          agent operates on, and the observed lifecycle state of that run.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of the environment.
            properties:
              classRef:
                description: |-
                  ClassRef references the SandboxClass this environment's sandbox is
                  built from. Immutable after creation.
                properties:
                  name:
                    description: Name is the name of the referenced SandboxClass.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: classRef is immutable
                  rule: self == oldSelf
              priority:
                default: 0
                description: |-
                  Priority influences scheduling order among environments competing for
                  a slot; higher values are scheduled first.
                format: int32
                maximum: 1000
                minimum: -1000
                type: integer
              repo:
                description: |-
                  Repo is the repository this environment's agent operates on, in
                  "owner/name" or "owner/name.git" form. Immutable after creation.
                minLength: 1
                pattern: ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(\.git)?$
                type: string
                x-kubernetes-validations:
                - message: repo is immutable
                  rule: self == oldSelf
              suspend:
                default: false
                description: |-
                  Suspend pauses scheduling of this environment: a suspended
                  environment will not be granted a slot, and a running sandbox will be
                  frozen, until suspend is cleared.
                type: boolean
              task:
                description: |-
                  Task describes the work the agent should perform. Immutable after
                  creation.
                properties:
                  issueRef:
                    description: |-
                      IssueRef references an issue whose title/body/comments the agent
                      should use as its task instructions.
                    properties:
                      number:
                        description: Number is the issue number.
                        format: int32
                        minimum: 1
                        type: integer
                      repo:
                        description: Repo is the repository the issue belongs to,
                          in "owner/name" form.
                        minLength: 1
                        type: string
                    required:
                    - number
                    - repo
                    type: object
                  prompt:
                    description: Prompt is free-form task instructions given directly
                      to the agent.
                    maxLength: 8192
                    type: string
                type: object
                x-kubernetes-validations:
                - message: task is immutable
                  rule: self == oldSelf
                - message: task requires at least one of prompt or issueRef
                  rule: (has(self.prompt) && size(self.prompt) > 0) || has(self.issueRef)
            required:
            - classRef
            - repo
            - task
            type: object
          status:
            default: {}
            description: Status is the most recently observed state of the environment.
            properties:
              agentResult:
                description: |-
                  AgentResult records the agent's own report of how its run ended, as
                  declared through the sandboxctl sidecar's POST /v1/done.
                properties:
                  exitCode:
                    description: |-
                      ExitCode is the process exit code the agent intends to exit with.
                      Advisory only: the pod's real exit code is what
                      internal/controller/podstatus.go observes.
                    format: int32
                    maximum: 255
                    minimum: 0
                    type: integer
                  message:
                    description: |-
                      Message is the agent's own explanation, truncated to 512 bytes by the
                      sidecar before it is written. Surfaced verbatim in the Ready
                      condition message via lifecycle.ClusterFacts.AgentMessage.
                    maxLength: 512
                    type: string
                  outcome:
                    description: AgentOutcome is how the agent reported its run ended.
                    enum:
                    - Succeeded
                    - Failed
                    type: string
                  reportedAt:
                    description: |-
                      ReportedAt is when this result was reported. Stamped by the sidecar,
                      never supplied by the agent.
                    format: date-time
                    type: string
                required:
                - outcome
                type: object
              archive:
                description: |-
                  Archive records the terminal archive written for this environment.
                  Written by the sandboxctl archive Job; read by the controller to clear
                  the finalizer and by retention GC to select archives past their TTL.
                properties:
                  contextPresent:
                    description: |-
                      ContextPresent is false when no agent-home snapshot existed to draw
                      context.tar.zst from (a never-frozen run whose pod was already gone).
                    type: boolean
                  finishedAt:
                    description: |-
                      FinishedAt is when the run reached its terminal phase (mirrors
                      status.finishedAt; duplicated here so retention GC need not parse
                      run.json to find the run's end time).
                    format: date-time
                    type: string
                  runJSONSHA256:
                    description: RunJSONSHA256 is the lowercase hex SHA-256 of run.json,
                      for audit.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  uri:
                    description: |-
                      URI is where the archive was written (e.g.
                      s3://<bucket>/<prefix>/<clusterID>/<ns>/<name>/<uid>/archive).
                    minLength: 1
                    type: string
                required:
                - uri
                type: object
              archiveURI:
                description: |-
                  ArchiveURI is the location of this environment's final workspace
                  archive, once the environment has reached a terminal phase.
                type: string
              conditions:
                description: |-
                  Conditions represents the latest available observations of this
                  environment's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: |-
                  FinishedAt is when the environment reached a terminal phase (Done or
                  Failed).
                format: date-time
                type: string
              freezeCount:
                default: 0
                description: |-
                  FreezeCount is the number of times this environment's sandbox has
                  been frozen.
                format: int32
                minimum: 0
                type: integer
              gitState:
                description: |-
                  GitState records the agent's final git state, if the agent recorded
                  one. Written by the sandboxctl sidecar from
                  /workspace/.sandbox/git-state.json during freeze; surfaced in run.json.
                properties:
                  branch:
                    description: Branch is the git branch the agent left the workspace
                      on.
                    type: string
                  headSHA:
                    description: HeadSHA is the lowercase hex SHA-1 of HEAD.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  pullRequest:
                    description: PullRequest, if the agent opened/updated one, references
                      it.
                    properties:
                      number:
                        description: Number is the pull request number.
                        format: int32
                        minimum: 1
                        type: integer
                      repo:
                        description: Repo is the repository the pull request belongs
                          to, in "owner/name" form.
                        minLength: 1
                        type: string
                    required:
                    - number
                    - repo
                    type: object
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller reconciling this environment.
                format: int64
                type: integer
              phase:
                default: Pending
                description: Phase is the coarse-grained lifecycle state of the environment.
                enum:
                - Pending
                - Ready
                - Running
                - Freezing
                - Waiting
                - Restoring
                - Done
                - Failed
                type: string
              phaseHistory:
                description: |-
                  PhaseHistory is the phase-transition history with timestamps, appended
                  on every phase change in lifecycle.Apply. It is the issue's "full
                  phase-transition history with timestamps" requirement: the Ready
                  condition only carries the LastTransitionTime for the *current* phase,
                  while this list preserves every transition so run.json can record them.
                  Capped at MaxPhaseHistoryEntries, oldest first: a long-lived
                  environment that freezes and wakes repeatedly keeps its most recent
                  transitions rather than wedging on the maxItems limit.
                items:
                  description: PhaseTransition records one observed phase change.
                  properties:
                    at:
                      description: At is when the environment was first observed in
                        this phase.
                      format: date-time
                      type: string
                    phase:
                      description: Phase is the phase the environment entered.
                      enum:
                      - Pending
                      - Ready
                      - Running
                      - Freezing
                      - Waiting
                      - Restoring
                      - Done
                      - Failed
                      type: string
                    reason:
                      description: |-
                        Reason is the Ready condition's Reason at the transition, if any (the
                        summary condition's reason carries the terminal/failure reason).
                      type: string
                  required:
                  - at
                  - phase
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              probeAttempt:
                description: |-
                  ProbeAttempt records the operator's most recent evaluation of
                  status.waitFor (#30). Written ONLY by the operator's ProbeEvaluator
                  (internal/controller/probe.go), never by the sidecar or the agent. It
                  is how a human, and the requeue logic, tell "still pending, will
                  retry" from "unevaluatable, will fail" without inferring anything from
                  timing.
                properties:
                  attempts:
                    description: Attempts is how many evaluation attempts have been
                      made so far.
                    format: int32
                    minimum: 0
                    type: integer
                  consecutiveErrors:
                    description: |-
                      ConsecutiveErrors is how many consecutive unevaluatable results have
                      been observed. When it reaches the evaluator's MaxConsecutiveErrors
                      threshold the environment fails rather than hanging.
                    format: int32
                    minimum: 0
                    type: integer
                  lastAttemptAt:
                    description: LastAttemptAt is when the most recent evaluation
                      ran.
                    format: date-time
                    type: string
                  lastResult:
                    description: |-
                      LastResult is the outcome of the most recent evaluation:
                      "satisfied", "pending", or "error".
                    enum:
                    - satisfied
                    - pending
                    - error
                    type: string
                  message:
                    description: Message is a human explanation. Never contains a
                      credential.
                    maxLength: 512
                    type: string
                  nextEligibleAt:
                    description: |-
                      NextEligibleAt is when the next evaluation may run. The evaluator
                      performs at most one I/O call per reconcile and suppresses calls
                      before this time; the requeue logic wakes the reconciler at it.
                    format: date-time
                    type: string
                  phase:
                    description: Phase is the current state of this probe attempt.
                    enum:
                    - Pending
                    - Satisfied
                    - Failed
                    type: string
                  reason:
                    description: |-
                      Reason is a short, stable machine reason. See
                      internal/lifecycle/conditions.go's ReasonProbeFailed.
                    maxLength: 64
                    type: string
                  type:
                    description: Type is the WaitForStatus.Type this attempt evaluated.
                    enum:
                    - GitProxyCheck
                    - HTTPGet
                    - S3ObjectExists
                    - NotBefore
                    type: string
                required:
                - phase
                - type
                type: object
              queuedSince:
                description: QueuedSince is when the environment started waiting for
                  a slot.
                format: date-time
                type: string
              restoreAttempt:
                description: |-
                  RestoreAttempt records the wake currently in flight, or the last one
                  that failed. Written ONLY by the restore init container (the same
                  sandboxctl binary, `restore` subcommand). It is how the operator, and
                  a human, tell a warm wake from a cold one -- and a corrupt snapshot
                  from a slow one -- without inferring anything from timing.
                properties:
                  attempts:
                    description: Attempts is how many restore attempts have been made
                      so far.
                    format: int32
                    minimum: 0
                    type: integer
                  durationMillis:
                    description: DurationMillis is how long the restore took.
                    format: int64
                    minimum: 0
                    type: integer
                  message:
                    description: Message is a human explanation. Never contains a
                      credential.
                    maxLength: 512
                    type: string
                  phase:
                    description: RestoreAttemptPhase is the state of the wake restore
                      being attempted.
                    enum:
                    - InProgress
                    - Succeeded
                    - Failed
                    type: string
                  reason:
                    description: |-
                      Reason is a short, stable machine reason. See
                      internal/sandboxctl/restore.go's RestoreReason* constants.
                    maxLength: 64
                    type: string
                  roots:
                    description: |-
                      Roots records the outcome per restored root. The workspace root is
                      the only one that can ever be Warm: the agent home is an emptyDir
                      that dies with the pod, so it is restored cold on every wake.
                    items:
                      description: RestoredRootStatus is one restored root's outcome.
                      properties:
                        bytesDownloaded:
                          description: |-
                            BytesDownloaded is the number of uncompressed bytes restored from
                            the backend into this root. Always 0 when Source is Warm -- this is
                            the acceptance criterion's "measurably skips the download", asserted
                            as a value rather than inferred from elapsed time.
                          format: int64
                          minimum: 0
                          type: integer
                        name:
                          description: |-
                            Name is the restored root: "workspace" (the mounted workspace PVC,
                            the only root that can ever be Warm) or "agent-home" (the per-pod
                            agent home emptyDir, always restored cold).
                          enum:
                          - workspace
                          - agent-home
                          type: string
                        source:
                          description: |-
                            Source is Warm when the retained PVC already held this exact
                            snapshot -- validated against the manifest, never inferred from the
                            PVC merely existing -- so no bytes were downloaded for this root.
                          enum:
                          - Warm
                          - Cold
                          type: string
                        warmMissReason:
                          description: |-
                            WarmMissReason, set only when Source is Cold, names why the warm
                            path was refused.
                          maxLength: 64
                          type: string
                      required:
                      - name
                      - source
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  seq:
                    description: Seq is the snapshot sequence number this attempt
                      is restoring.
                    format: int32
                    minimum: 0
                    type: integer
                  snapshotID:
                    description: |-
                      SnapshotID is the snapshot directory name restored from
                      ("<seq:05d>-<RFC3339>"), so a human can find the exact objects.
                    maxLength: 128
                    type: string
                  startedAt:
                    description: StartedAt is when this attempt (this Seq) was first
                      recorded.
                    format: date-time
                    type: string
                  updatedAt:
                    description: |-
                      UpdatedAt is when this attempt was last patched (a retry, a phase
                      change, or a per-root outcome landing).
                    format: date-time
                    type: string
                required:
                - phase
                - seq
                type: object
              slot:
                description: |-
                  Slot records whether this environment currently holds a scheduling
                  slot.
                properties:
                  granted:
                    default: false
                    description: |-
                      Granted is true when this environment currently holds a scheduling
                      slot.
                    type: boolean
                  grantedAt:
                    description: GrantedAt is when the slot was granted.
                    format: date-time
                    type: string
                  leaseName:
                    description: LeaseName is the name of the lease resource backing
                      the granted slot.
                    type: string
                type: object
              snapshot:
                description: |-
                  Snapshot records the most recent workspace snapshot taken for this
                  environment.
                properties:
                  durationMillis:
                    description: |-
                      DurationMillis is how long the snapshot took, from the start of the
                      freeze hook to the successful latest.json write. Milliseconds, not
                      seconds: a small workspace snapshots in well under a second and a
                      whole-second field would record a meaningless 0.
                    format: int64
                    minimum: 0
                    type: integer
                  seq:
                    description: |-
                      Seq is the monotonically increasing sequence number of this
                      snapshot.
                    format: int32
                    minimum: 0
                    type: integer
                  sha256:
                    description: SHA256 is the lowercase hex-encoded SHA-256 checksum
                      of the snapshot.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  sizeBytes:
                    description: SizeBytes is the size of the snapshot in bytes.
                    format: int64
                    type: integer
                  takenAt:
                    description: TakenAt is when the snapshot was taken.
                    format: date-time
                    type: string
                  uri:
                    description: URI is the location the snapshot was written to.
                    type: string
                required:
                - seq
                type: object
              snapshotAttempt:
                description: |-
                  SnapshotAttempt records the freeze snapshot currently in flight, or
                  the last one that failed. Written ONLY by the sandboxctl sidecar (or
                  the recovery Job running the same binary). It is how the operator, and
                  a human, distinguish "still retrying" from "permanently failed": on
                  permanent failure the environment HOLDS in Freezing with
                  Frozen=False/SnapshotFailed and the pod is never deleted, so the
                  agent's context is never silently dropped.
                properties:
                  attempts:
                    description: Attempts is how many upload attempts have been made
                      so far.
                    format: int32
                    minimum: 0
                    type: integer
                  message:
                    description: |-
                      Message is a human explanation. Never contains a credential -- see
                      internal/storage/doc.go's no-logging rule and credentials.go's
                      Secret redaction.
                    maxLength: 512
                    type: string
                  phase:
                    description: SnapshotAttemptPhase is the state of the freeze snapshot
                      being attempted.
                    enum:
                    - InProgress
                    - Succeeded
                    - Failed
                    type: string
                  reason:
                    description: |-
                      Reason is a short, stable machine reason. See
                      internal/sandboxctl/snapshot.go's SnapshotReason* constants.
                    maxLength: 64
                    type: string
                  seq:
                    description: |-
                      Seq is the snapshot sequence number this attempt is producing. It
                      always equals status.freezeCount for the freeze in flight.
                    format: int32
                    minimum: 0
                    type: integer
                  startedAt:
                    description: StartedAt is when this attempt (this Seq) was first
                      recorded.
                    format: date-time
                    type: string
                  updatedAt:
                    description: |-
                      UpdatedAt is when this attempt was last patched (a retry, a phase
                      change).
                    format: date-time
                    type: string
                required:
                - phase
                - seq
                type: object
              startedAt:
                description: StartedAt is when the sandbox first started running.
                format: date-time
                type: string
              terminalPhase:
                description: |-
                  TerminalPhase records the terminal phase (Done or Failed) the
                  environment reached, set once when the run first terminated. Used by
                  the freeze-detour path (#32) to return to the correct terminal phase
                  after capturing the agent home, rather than re-running the agent.
                enum:
                - Pending
                - Ready
                - Running
                - Freezing
                - Waiting
                - Restoring
                - Done
                - Failed
                type: string
              waitFor:
                description: |-
                  WaitFor records the external condition, if any, blocking a frozen
                  sandbox from being restored.
                properties:
                  declaredAt:
                    description: |-
                      DeclaredAt is when this wait condition was declared. Stamped by the
                      sidecar, never supplied by the agent.
                    format: date-time
                    type: string
                  params:
                    additionalProperties:
                      type: string
                    description: |-
                      Params carries type-specific parameters for the wait condition. Which
                      keys are required/permitted per Type is enforced fail-closed by
                      internal/sandboxctl/probe.go; see that file for the per-type table.
                    maxProperties: 16
                    type: object
                  reason:
                    description: |-
                      Reason is a human-readable explanation of why this wait was
                      declared.
                    maxLength: 512
                    type: string
                  type:
                    description: |-
                      Type identifies the kind of condition being waited on. The enum IS
                      the allowlist: the API server rejects anything else, and
                      internal/sandboxctl rejects it earlier with an actionable error.
                      The members are exactly the probe types issue #30 will evaluate.
                    enum:
                    - GitProxyCheck
                    - HTTPGet
                    - S3ObjectExists
                    - NotBefore
                    type: string
                required:
                - type
                type: object
              wakeCount:
                default: 0
                description: |-
                  WakeCount is the number of times this environment's sandbox has been
                  restored from a frozen state.
                format: int32
                minimum: 0
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
