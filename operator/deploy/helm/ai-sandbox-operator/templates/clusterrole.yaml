{{- if .Values.rbac.create }}
# This rules: block is byte-for-byte the same rule set as
# config/rbac/role.yaml (generated by `make manifests` from the operator's
# own +kubebuilder:rbac markers) -- CI's helm-rbac-check (operator/Makefile)
# asserts the two never drift. Do not hand-edit this file's rules without
# also regenerating config/rbac/role.yaml the same way, and vice versa.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-sandbox-operator.fullname" . }}
  labels:
    {{- include "ai-sandbox-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - serviceaccounts
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxclasses/status
  - sandboxenvironments/status
  - servicesets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxenvironments
  - servicesets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.psenna.dev
  resources:
  - sandboxenvironments/finalizers
  - servicesets/finalizers
  verbs:
  - update
{{- end }}
