apiVersion: v1
kind: Pod
metadata:
  labels:
    app.kubernetes.io/component: sandbox-environment
    app.kubernetes.io/instance: none-full
    app.kubernetes.io/managed-by: ai-sandbox-operator
    app.kubernetes.io/name: ai-sandbox
    app.kubernetes.io/part-of: ai-sandbox
    sandbox.psenna.dev/class: default
    sandbox.psenna.dev/environment: none-full
  name: none-full-run
  namespace: default
  ownerReferences:
  - apiVersion: sandbox.psenna.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: SandboxEnvironment
    name: none-full
    uid: 11111111-1111-1111-1111-111111111111
spec:
  automountServiceAccountToken: false
  containers:
  - args:
    - bash
    - -c
    - |
      set -euo pipefail
      exec claude -p "$(cat /etc/ai-sandbox/task.md)"
    envFrom:
    - secretRef:
        name: none-full-env
    image: ghcr.io/psenna/ai-sandbox-agent:v1
    name: agent
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - mountPath: /workspace
      name: workspace
    - mountPath: /home/node/.claude-sandbox
      name: agent-home
    - mountPath: /etc/ai-sandbox
      name: config
      readOnly: true
    workingDir: /workspace
  restartPolicy: Never
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: none-full-agent
  terminationGracePeriodSeconds: 120
  volumes:
  - name: workspace
    persistentVolumeClaim:
      claimName: none-full-workspace
  - emptyDir: {}
    name: agent-home
  - configMap:
      defaultMode: 292
      name: none-full-config
    name: config
