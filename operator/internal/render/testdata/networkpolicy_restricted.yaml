apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: sandbox-environment
    app.kubernetes.io/instance: restricted-env
    app.kubernetes.io/managed-by: ai-sandbox-operator
    app.kubernetes.io/name: ai-sandbox
    app.kubernetes.io/part-of: ai-sandbox
    sandbox.psenna.dev/class: default
    sandbox.psenna.dev/environment: restricted-env
  name: restricted-env-netpolicy
  namespace: default
  ownerReferences:
  - apiVersion: sandbox.psenna.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: SandboxEnvironment
    name: restricted-env
    uid: 11111111-1111-1111-1111-111111111111
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - to:
    - podSelector:
        matchLabels:
          sandbox.psenna.dev/environment: restricted-env
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 140.82.112.0/20
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-sandbox
      podSelector:
        matchLabels:
          app: git-proxy
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-sandbox-operator-system
      podSelector:
        matchLabels:
          control-plane: controller-manager
  podSelector:
    matchLabels:
      sandbox.psenna.dev/environment: restricted-env
  policyTypes:
  - Ingress
  - Egress
