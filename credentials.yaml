# Upstream credentials the proxy attaches on the proxy -> GitHub leg.
# The agent NEVER sees these. The proxy resolves credentials by the repository
# path it forwards (here "OWNER/REPO.git" -> GitHub owner "OWNER", repo "REPO").
#
# This file is committed with PLACEHOLDERS ONLY. NEVER commit a real PAT.
# Put your real PAT in one of two places:
#   1. edit this file locally (it is NOT gitignored — keep the placeholder in git,
#      edit your local working copy, and never `git add` the real value), OR
#   2. export GITHUB_TOKEN (and optionally GITHUB_USERNAME / GITHUB_PASSWORD) in
#      your shell / .env and pass them to the git-proxy container via
#      docker-compose.yaml (env > file > empty; the env-var name is the profile
#      name uppercased — name: GITHUB -> GITHUB_TOKEN).
#
# This is the PROFILE layout (a list under `credentials:`). Each profile maps a
# set of repository patterns to the upstream credentials the proxy uses on that
# leg. Wildcard patterns like "myorg/*" are allowed; bare "*" and "**" are not.
#
# The SAME GitHub PAT serves both legs:
#   - git protocol (clone/fetch/push): HTTP Basic with username "x-access-token" +
#     the PAT as the password. GitHub accepts this canonical form for both classic
#     and fine-grained PATs. (internal/upstream/plain/plain.go applyCreds reads
#     only username/password.)
#   - broker REST (PR + CI + issues): Bearer, read from the `token` field.
#     (internal/upstream/github/github.go restClient/tokenFor reads `token`.)
#
# Replace OWNER/REPO with your repo (must match GITHUB_REPO in .env) and the two
# REPLACE_WITH_GITHUB_PAT values with your own PAT, then `docker compose restart
# git-proxy`.

credentials:
  - name: GITHUB
    description: "GitHub PAT for the agent's repo (git protocol + broker)"
    username: x-access-token
    password: REPLACE_WITH_GITHUB_PAT
    token: REPLACE_WITH_GITHUB_PAT
    repos:
      - "OWNER/REPO.git"