name: operator e2e

on:
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - '.github/workflows/operator-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'operator/**'
      - '.github/workflows/operator-e2e.yml'
  workflow_dispatch:
    inputs:
      repeat:
        description: 'number of consecutive runs (soak testing)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: operator-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches operator.yml's own pin -- see that file's comment on why this
  # is an exact patch, not a floating "1.25".
  GO_VERSION: "1.25.13"

defaults:
  run:
    working-directory: operator

jobs:
  # Computes a [1, 2, ..., N] JSON array from the workflow_dispatch `repeat`
  # input (default 1) for the e2e job's matrix below -- the GitHub Actions
  # expression language has no range()/sequence built-in, so this is done
  # with a shell one-liner instead.
  matrix:
    name: compute run matrix
    runs-on: ubuntu-latest
    # Overrides the workflow-level `defaults.run.working-directory: operator`
    # -- this job never checks out the repo (it only computes a JSON array
    # from an input), so an `operator/` directory never exists in its
    # workspace. Without this override the runner tries to `cd operator`
    # before the step even starts and fails outright.
    defaults:
      run:
        working-directory: .
    outputs:
      runs: ${{ steps.gen.outputs.runs }}
    steps:
      - id: gen
        run: |
          n="${{ github.event.inputs.repeat || '1' }}"
          runs="$(seq 1 "$n" | jq -cs .)"
          echo "runs=$runs" >>"$GITHUB_OUTPUT"

  e2e:
    name: kind e2e
    needs: matrix
    runs-on: ubuntu-latest
    # e2e-up (~3m) + e2e-run (ginkgo --timeout=25m, see operator/Makefile
    # E2E_TIMEOUT) + e2e-collect/e2e-down (~1m). Raised from 25 to keep the job
    # step timeout ahead of the raised ginkgo suite timeout.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.matrix.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: operator/test/e2e/go.sum

      - uses: docker/setup-buildx-action@v3

      # On a GitHub Actions runner, IN_CONTAINER=1 means every make target
      # below runs natively on the runner (not wrapped in another docker
      # run) -- same convention operator.yml's own jobs already use.
      # DOCKER_HOST here is the runner's own local Docker daemon (no
      # remote/nested DinD, unlike the sandbox this suite was developed
      # against), so E2E_HOST resolves to 127.0.0.1 via kind-cluster.yaml's
      # extraPortMappings (LoadConfig's own default) rather than
      # `<cluster>-control-plane`, and E2E_INTERNAL_KUBECONFIG stays unset
      # (see the Makefile's default for it).
      - name: fetch e2e tools (kind, kubectl)
        run: make IN_CONTAINER=1 E2E_BIN_DIR=$PWD/.e2e-bin e2e-tools

      - name: e2e up
        run: make IN_CONTAINER=1 E2E_BIN_DIR=$PWD/.e2e-bin E2E_KUBECONFIG=$PWD/.e2e-kubeconfig e2e-up

      - name: e2e run
        run: make IN_CONTAINER=1 E2E_KUBECONFIG=$PWD/.e2e-kubeconfig e2e-run

      - name: e2e collect (diagnostics)
        if: always()
        run: make IN_CONTAINER=1 E2E_BIN_DIR=$PWD/.e2e-bin E2E_KUBECONFIG=$PWD/.e2e-kubeconfig e2e-collect

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.run }}
          path: operator/test/e2e/_artifacts
          retention-days: 14
          if-no-files-found: warn

      - name: e2e down
        if: always()
        run: make IN_CONTAINER=1 E2E_BIN_DIR=$PWD/.e2e-bin E2E_KUBECONFIG=$PWD/.e2e-kubeconfig e2e-down
