name: docker-operator agent image

# Build docker-operator's two harness images -- the Claude Code image
# (docker-operator/agent/Dockerfile) and its opencode sibling
# (docker-operator/agent-opencode/Dockerfile) -- and publish each to the
# GitHub Container Registry:
#
#   ghcr.io/<owner>/ai-sandbox-agent:<UTC date-time>           immutable, one per build
#   ghcr.io/<owner>/ai-sandbox-agent:latest                    moving pointer
#   ghcr.io/<owner>/ai-sandbox-agent-opencode:<UTC date-time>   immutable, one per build
#   ghcr.io/<owner>/ai-sandbox-agent-opencode:latest            moving pointer
#
# This closes the ":dev, build it yourself" gap called out in
# internal/config's defaultAgentImage/defaultAgentImageOpenCode comments and
# docker-operator-release.yml's header -- both agent images now have a real
# published home (before this, config.AgentImageOpenCode's default pointed at
# an image that was never published -- see the agent-image-opencode job
# below).
#
# Trigger: a push to `main` that touches docker-operator/agent/** (the Claude
# image: Dockerfile, tmux-boot.sh, the use-git-proxy fork) OR
# docker-operator/agent-opencode/** (the opencode image: Dockerfile,
# opencode-supervisor.sh -- it also COPYs docker-operator/agent/tmux-boot.sh
# and docker-operator/agent/skills/use-git-proxy/SKILL.md, already covered by
# the docker-operator/agent/** entry above) OR one of the assets both
# Dockerfiles COPY from OUTSIDE docker-operator/agent{,-opencode}/ --
# claude-code/entrypoint.sh, claude-code/agent-context/CLAUDE.md, and the four
# claude-code/*/SKILL.md files they bake unforked (use-docker,
# use-dependaproxy, implement-issue, store-file) -- or this workflow file. A
# pull request touching the same paths BUILDS both images (both architectures)
# but does not push, so a broken Dockerfile still fails a check.
# workflow_dispatch runs both jobs on demand -- use it for the very first
# publish, or to re-cut :latest with no path-filter-matching change at all.
on:
  push:
    branches: [main]
    paths:
      - 'docker-operator/agent/**'
      - 'docker-operator/agent-opencode/**'
      - 'claude-code/entrypoint.sh'
      - 'claude-code/agent-context/CLAUDE.md'
      - 'claude-code/use-docker/SKILL.md'
      - 'claude-code/use-dependaproxy/SKILL.md'
      - 'claude-code/implement-issue/SKILL.md'
      - 'claude-code/store-file/SKILL.md'
      - '.github/workflows/docker-operator-agent-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker-operator/agent/**'
      - 'docker-operator/agent-opencode/**'
      - 'claude-code/entrypoint.sh'
      - 'claude-code/agent-context/CLAUDE.md'
      - 'claude-code/use-docker/SKILL.md'
      - 'claude-code/use-dependaproxy/SKILL.md'
      - 'claude-code/implement-issue/SKILL.md'
      - 'claude-code/store-file/SKILL.md'
      - '.github/workflows/docker-operator-agent-image.yml'
  workflow_dispatch:

permissions:
  contents: read    # checkout
  packages: write   # push to ghcr.io (push / dispatch only; a PR never pushes)

# One publish per ref at a time; a newer push supersedes an in-flight older one.
concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-image:
    name: build + publish agent image
    runs-on: ubuntu-latest
    # Canonical repo only for publishes; a fork's PRs still get the build.
    if: github.repository == 'psenna/ai-sandbox' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: compute image tags
        id: tags
        run: |
          set -eu
          repo="ghcr.io/${{ github.repository_owner }}/ai-sandbox-agent"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Not pushed -- just a stable name for build logs / cache.
            tags="$repo:pr-${{ github.event.number }}"
            ts=""
          else
            ts="$(date -u +'%Y%m%d-%H%M%S')"
            tags="$repo:$ts"$'\n'"$repo:latest"
          fi
          {
            echo "timestamp=$ts"
            printf 'tags<<EOF\n%s\nEOF\n' "$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          # docker-operator/agent/Dockerfile COPYs from the repo root
          # (claude-code/*/SKILL.md, claude-code/entrypoint.sh, ...), so the
          # build context is the checkout root, not docker-operator/agent/.
          context: .
          file: docker-operator/agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # The Dockerfile does not cross-compile, so the arm64 leg builds
          # under QEMU emulation -- slower, but it matches
          # docker-operator-release.yml's own copied pattern.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          # Plain multi-arch manifest list, same as a local `docker build`.
          provenance: false

      - name: summary
        if: github.event_name != 'pull_request'
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/ai-sandbox-agent"
          {
            echo "### Published agent image"
            echo
            echo '```'
            echo "$repo:${{ steps.tags.outputs.timestamp }}"
            echo "$repo:latest"
            echo '```'
            echo
            echo "Pin the date-time tag in \`docker-operator/.env.example\` /"
            echo "\`docker-compose.yaml\` / \`internal/config/config.go\` for a"
            echo "reproducible default."
          } >> "$GITHUB_STEP_SUMMARY"

  agent-image-opencode:
    name: build + publish agent-opencode image
    runs-on: ubuntu-latest
    # Canonical repo only for publishes; a fork's PRs still get the build.
    if: github.repository == 'psenna/ai-sandbox' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: compute image tags
        id: tags
        run: |
          set -eu
          repo="ghcr.io/${{ github.repository_owner }}/ai-sandbox-agent-opencode"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Not pushed -- just a stable name for build logs / cache.
            tags="$repo:pr-${{ github.event.number }}"
            ts=""
          else
            ts="$(date -u +'%Y%m%d-%H%M%S')"
            tags="$repo:$ts"$'\n'"$repo:latest"
          fi
          {
            echo "timestamp=$ts"
            printf 'tags<<EOF\n%s\nEOF\n' "$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          # docker-operator/agent-opencode/Dockerfile COPYs from the repo root
          # (claude-code/*/SKILL.md, claude-code/entrypoint.sh,
          # docker-operator/agent/{tmux-boot.sh,skills/use-git-proxy}, ...),
          # so the build context is the checkout root, not
          # docker-operator/agent-opencode/.
          context: .
          file: docker-operator/agent-opencode/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # The Dockerfile does not cross-compile, so the arm64 leg builds
          # under QEMU emulation -- slower, but it matches
          # docker-operator-release.yml's own copied pattern.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          # Plain multi-arch manifest list, same as a local `docker build`.
          provenance: false

      - name: summary
        if: github.event_name != 'pull_request'
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/ai-sandbox-agent-opencode"
          {
            echo "### Published agent-opencode image"
            echo
            echo '```'
            echo "$repo:${{ steps.tags.outputs.timestamp }}"
            echo "$repo:latest"
            echo '```'
            echo
            echo "Pin the date-time tag in \`docker-operator/.env.example\` /"
            echo "\`docker-compose.yaml\` / \`internal/config/config.go\` for a"
            echo "reproducible default (\`AGENT_IMAGE_OPENCODE\`)."
          } >> "$GITHUB_STEP_SUMMARY"
