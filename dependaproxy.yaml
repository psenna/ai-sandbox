# DependaProxy configuration for the ai-sandbox stack — npm, pypi, and Go module
# proxy.
#
# The agent's clients (claude itself + DinD workload containers) point their
# registries at http://dependaproxy:8080/{npm,pypi,goproxy}. Every package is
# validated (minimum publication age), hashed, and served only if the bytes match
# the stored hash.
#
# Auth is DISABLED (empty token) on purpose: Go's module client refuses to send
# credentials over plaintext HTTP, so the goproxy registry cannot use a token.
# The proxy sits on isolated internal bridge networks (proxynet/dinernet/dbnet)
# and the supply-chain protection (validation + hashing + the DinD egress block)
# is unaffected by auth. If you re-enable auth, set a token here AND in .env
# (DEPENDAPROXY_TOKEN) — npm sends it as a Bearer header, pip and Go as HTTP
# Basic auth (password == token).
#
# Secrets: this file is committed with PLACEHOLDERS ONLY, like credentials.yaml.
#   - storage.dsn password: internal-only dev default (postgres is on the isolated
#     dbnet, unreachable from claude/DinD). If you change it, change POSTGRES_PASSWORD
#     in docker-compose.yaml too.

server:
  addr: ":8080"

auth:
  token: ""

storage:
  type: postgres
  dsn: "postgres://dependaproxy:dependaproxy-secret@postgres:5432/dependaproxy?sslmode=disable"

log:
  level: info
  format: json

registries:
  - type: npm
    prefix: /npm
    upstream: https://registry.npmjs.org
    validation:
      - type: min-publication-age
        params:
          min_days: 7
      # Fast static heuristics on the tarball (npm install scripts + suspicious
      # script contents). warn: serve + log rather than deny.
      - type: malware-scan
        params:
          mode: warn
      # Real malware scanner (GuardDog CLI). Runs after the fast heuristic.
      # deny (default, 403) | warn (serve + log). on_error: fail_open (default)
      # | fail_closed. timeout: scan budget (default 60s). sandbox: true
      # (default) | false — set false if Landlock is blocked in the container.
      - type: guarddog-scan
        params:
          mode: deny
          on_error: fail_open
          timeout: 60s
          sandbox: false
    retrieval:
      - type: local-disk-cache
        params:
          path: /var/lib/dependaproxy/cache/npm
      - type: upstream-registry

  - type: pypi
    prefix: /pypi
    upstream: https://pypi.org/simple
    validation:
      - type: min-publication-age
        params:
          min_days: 7
      # Fast static heuristics on the wheel/sdist (setup.py/PKG-INFO patterns +
      # wheel exec files). warn: serve + log rather than deny.
      - type: malware-scan
        params:
          mode: warn
      # Real malware scanner (GuardDog CLI). deny (default, 403) | warn.
      # on_error: fail_open (default) | fail_closed. sandbox: false because
      # Landlock is not available in this container.
      - type: guarddog-scan
        params:
          mode: deny
          on_error: fail_open
          timeout: 60s
          sandbox: false
    retrieval:
      - type: local-disk-cache
        params:
          path: /var/lib/dependaproxy/cache/pypi
      - type: upstream-registry

  - type: goproxy
    prefix: /goproxy
    upstream: https://proxy.golang.org
    validation:
      - type: min-publication-age
        params:
          min_days: 7
      # Virus scanners (malware-scan / guarddog-scan) are npm/pypi-only — they
      # do not support Go modules. The Go-equivalent supply-chain scan is
      # cve-check, mapped to OSV's "Go" ecosystem. deny (default) | warn;
      # on_error: fail_open (default) | fail_closed.
      - type: cve-check
        params:
          mode: deny
          on_error: fail_open
    retrieval:
      - type: local-disk-cache
        params:
          path: /var/lib/dependaproxy/cache/goproxy
      - type: upstream-registry
