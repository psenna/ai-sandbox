# docker-operator: the shared-services stack (ollama, git-proxy, postgres,
# dependaproxy -- unchanged from the root ai-sandbox/docker-compose.yaml,
# minus the single static `docker` DinD sidecar and `claude` agent, which
# this stack replaces with the operator creating one DinD sidecar + one
# agent container PER AGENT, on demand, via the real Docker API) plus the
# docker-operator service itself.
#
# Topology:
#   docker-operator-proxynet (shared, singleton): ollama, git-proxy,
#     dependaproxy, and every agent container. NOT the operator -- see below.
#   docker-operator-dbnet (shared, singleton): postgres, dependaproxy only.
#   docker-operator-operatornet (singleton): the operator alone. It drives
#     agents through the bind-mounted Docker socket, never over the network,
#     and it never dials the shared services (it only templates their URLs
#     into each agent's environment), so it needs no shared network -- and
#     must not have one: every agent joins proxynet, so an operator on
#     proxynet would expose its unauthenticated REST API and terminal
#     WebSocket to every agent, defeating the per-agent dinernet isolation.
#     The host reaches the API through the published 127.0.0.1 port, which
#     does not depend on any shared network.
#   docker-operator-agent-<id>-dinernet (per agent, PRIVATE, created and torn
#     down by the operator itself -- not declared here at all): each agent's
#     own DinD sidecar, plus dependaproxy connected into it dynamically at
#     create time so workload containers inside that agent's nested daemon
#     can reach it (there is no longer one static dependaproxy IP shared by
#     every agent -- see docker-operator/agent/skills/use-docker/SKILL.md).
#
# The docker-operator container is the one thing in this whole repo that
# holds a real Docker credential (the bind-mounted socket below) -- it is
# the trusted control plane that creates/inspects/removes every other
# container, the same "manager holds the credential, the managed workload
# does not" split the Kubernetes operator already uses. No agent container
# ever gets this socket, and no agent shares a network with it.
#
# Prerequisites: same as the root stack's -- sysbox-ce installed
# (setup-ubuntu-host.sh) for the per-agent DinD sidecars' runtime, and
# `make agent-image` run once so AGENT_IMAGE exists locally.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: docker-operator-ollama
    environment:
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-131072}"
    volumes:
      - ../.ollama:/root/.ollama
    networks:
      - proxynet
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # config.yaml/credentials.yaml are the ROOT stack's files (../), not a
  # docker-operator-local copy: they are exactly the same git-proxy
  # configuration either stack needs, and duplicating them would only invite
  # the two copies to drift. See ai-sandbox/README.md's Setup section for how
  # to populate credentials.yaml -- unchanged here.
  git-proxy:
    image: ghcr.io/psenna/git-proxy:v0.0.11
    container_name: docker-operator-gitproxy
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080" # git-protocol leg (clone/fetch/push)
      - "127.0.0.1:8090:8090" # broker REST leg (PR + CI + issue ops)
    volumes:
      - ../config.yaml:/config.yaml:ro
      - ../credentials.yaml:/credentials.yaml:ro
      - ./data/mirror:/tmp/git-proxy-mirror
      - ./data/audit:/tmp/git-proxy
    networks:
      - proxynet

  postgres:
    image: postgres:18
    container_name: docker-operator-postgres
    environment:
      POSTGRES_USER: dependaproxy
      POSTGRES_PASSWORD: dependaproxy-secret
      POSTGRES_DB: dependaproxy
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dependaproxy -d dependaproxy"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # container_name MUST equal internal/config's DependaproxyContainer default
  # (docker-operator-dependaproxy) -- the create flow's NetworkConnect looks
  # it up by exactly this name on each new agent's private dinernet.
  # No static dinernet IP or dinernet membership here at all: unlike the
  # root stack's single shared dinernet, connecting dependaproxy into a
  # per-agent dinernet is the operator's job at create time, not compose's.
  dependaproxy:
    image: ghcr.io/psenna/dependaproxy:v0.0.7
    container_name: docker-operator-dependaproxy
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../dependaproxy.yaml:/config.yaml:ro
      - ./data/dependaproxy-cache:/var/lib/dependaproxy/cache
    networks:
      - proxynet
      - dbnet

  docker-operator:
    build:
      context: ..
      dockerfile: docker-operator/Dockerfile
    image: docker-operator:0.1.0
    container_name: docker-operator
    depends_on:
      ollama:
        condition: service_healthy
      git-proxy:
        condition: service_started
      dependaproxy:
        condition: service_started
    ports:
      - "127.0.0.1:${LISTEN_PORT:-8000}:8000"
    environment:
      LISTEN_ADDR: "0.0.0.0:8000"
      STATE_DB_PATH: "/var/lib/docker-operator/state.db"
      MAX_AGENTS: "${MAX_AGENTS:-5}"
      AGENT_IMAGE: "${AGENT_IMAGE:-ghcr.io/psenna/ai-sandbox-docker-operator-agent:dev}"
      DOCKER_RUNTIME: "${DOCKER_RUNTIME:-sysbox-runc}"
      # The backend a create request that names none falls back to. Each
      # agent records its own choice; this is only the create-form default.
      DEFAULT_AGENT_BACKEND: "${DEFAULT_AGENT_BACKEND:-ollama}"

      # OPTIONAL but strongly recommended: a static Bearer required on every
      # REST API call and terminal-WebSocket connection. Empty leaves the API
      # open to anything that can reach the published port (the operator logs
      # a startup warning). In the browser, open the UI once as
      # http://127.0.0.1:8000/?token=<value> -- it is stored and stripped
      # from the URL. For curl: `-H "Authorization: Bearer <value>"`.
      OPERATOR_API_TOKEN: "${OPERATOR_API_TOKEN:-}"

      # git-proxy legs. AGENT_TOKEN is REQUIRED -- the Bearer every agent
      # presents to git-proxy (not a GitHub PAT; git-proxy consumes it for
      # auth and never forwards it). GITHUB_REPO is OPTIONAL: it is the repo
      # a create request that names no per-agent repo falls back to, and an
      # agent with none boots as a bare Claude terminal that clones on
      # demand. Each agent can also be pinned to its own repo on the create
      # form / via the POST /api/agents "repo" field.
      AGENT_TOKEN: "${AGENT_TOKEN}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      GIT_PROXY_URL: "http://git-proxy:8080"
      GIT_PROXY_BROKER_URL: "http://git-proxy:8090"

      # DependaProxy: these URLs are templated into each agent's environment
      # (agents resolve "dependaproxy" by name on proxynet); the operator
      # itself never dials it. The per-agent dinernet address is resolved per
      # agent by the create flow, not set here.
      DEPENDAPROXY_URL: "http://dependaproxy:8080/npm"
      DEPENDAPROXY_PYPI_URL: "http://dependaproxy:8080/pypi"
      DEPENDAPROXY_GOPROXY_URL: "http://dependaproxy:8080/goproxy"
      DEPENDAPROXY_CONTAINER: "docker-operator-dependaproxy"

      # Ollama-backend model routing: the create-form defaults for an
      # "ollama" agent's opus tier and its sonnet+haiku tiers. Overridable
      # per agent on the create form / via the POST /api/agents body. An
      # "anthropic" agent ignores these and OLLAMA_URL entirely -- it uses
      # the shared Anthropic credential (web UI "Anthropic account" panel /
      # PUT /api/anthropic/auth).
      OLLAMA_URL: "http://ollama:11434"
      AGENT_MODEL: "${OLLAMA_MODEL:-glm-5.3:cloud}"
      AGENT_FAST_MODEL: "${OLLAMA_FAST_MODEL:-glm-5.3-flash:cloud}"

      # Centralized per-agent file store. FILESTORE_DIR (the path the operator
      # sees it at) and FILESTORE_VOLUME (the Docker volume name the daemon
      # resolves each agent's subpath mount against) are TWO NAMES FOR THE
      # SAME STORAGE -- the `- filestore:...` volume mount below pairs them.
      # Set FILESTORE_DIR to "" to disable the feature (no file API, no
      # /workspace/store mount).
      FILESTORE_DIR: "/var/lib/docker-operator/filestore"
      FILESTORE_VOLUME: "docker-operator-filestore"
    volumes:
      # The trusted control-plane credential -- see the header comment.
      - /var/run/docker.sock:/var/run/docker.sock
      - operator-state:/var/lib/docker-operator
      - filestore:/var/lib/docker-operator/filestore
    networks:
      # operatornet ONLY -- deliberately no proxynet. See the header comment:
      # the operator talks to agents through the Docker socket, not the
      # network, so sharing a network with them only widens the attack
      # surface. The operator logs a startup WARNING if it finds itself on
      # the agent network anyway (cmd/docker-operator: warnIfReachableFromAgents).
      - operatornet

networks:
  # Shared singletons. Explicit `name:` so they land under exactly the names
  # internal/config's ProxynetName/DbnetName defaults expect -- compose would
  # otherwise prefix them with this directory's name, and every agent
  # container's NetworkAttachment would then point at a network that does
  # not exist.
  proxynet:
    name: docker-operator-proxynet
    driver: bridge
  dbnet:
    name: docker-operator-dbnet
    driver: bridge
  # The operator's own isolation boundary: nothing else joins this. The
  # operator needs a network for its published 127.0.0.1:8000 port to work
  # but must not be reachable from any agent.
  operatornet:
    name: docker-operator-operatornet
    driver: bridge

volumes:
  pgdata: {}
  operator-state: {}
  # The centralized per-agent file store. Explicit `name:` so it lands under
  # exactly the name FILESTORE_VOLUME expects (compose would otherwise prefix
  # it with this directory's name) and so every agent's per-agent subpath
  # mount resolves. Deliberately NOT labelled ai-sandbox.docker-operator/
  # managed: like the shared singleton networks, this is shared infra no
  # single agent record owns. `docker compose down -v` DOES delete it.
  filestore:
    name: docker-operator-filestore
