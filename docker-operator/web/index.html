<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docker-operator</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
	<aside class="sidebar" id="sidebar">
		<button id="new-agent-btn" class="new-agent-btn btn btn--primary" type="button">+ New Agent</button>
		<button id="files-btn" class="files-btn btn btn--ghost" type="button">Files</button>
		<button id="activity-btn" class="activity-btn btn btn--ghost" type="button">Activity</button>
		<ul id="agent-list" class="agent-list">
			<li class="agent-list__loading">Loading…</li>
		</ul>
		<button id="settings-btn" class="settings-btn btn btn--ghost" type="button">Settings</button>
		<div id="agent-capacity" class="agent-capacity"></div>
	</aside>
	<div class="main-panel">
		<button id="sidebar-toggle" class="sidebar-toggle btn btn--ghost btn--sm btn--icon" type="button" title="Collapse sidebar" aria-expanded="true">‹</button>
		<main id="main-area" class="main-area">
			<p class="placeholder">Select an agent, or create a new one.</p>
		</main>
	</div>
</div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="auth.js"></script>
<script src="render.js"></script>
<script src="confirm.js"></script>
<script src="app.js"></script>
<script src="terminal.js"></script>
<script src="files.js"></script>
</body>
</html>
